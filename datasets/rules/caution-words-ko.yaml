  - { word: 또라이, category: insult, match: substring }
  - { word: 호구, category: insult, match: substring }
  - { word: 거지, category: insult, match: substring }
  - { word: 돼지, category: insult, match: substring }
  - { word: 변태, category: insult, match: substring }
  - { word: 고자, category: insult, match: substring }
  - { word: 똥, category: bodily, match: substring }
