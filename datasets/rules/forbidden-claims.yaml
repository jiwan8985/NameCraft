# 금지 표현 lint (REQ-NF-005, 기획서 §1.2 '금지') — 해설 템플릿·AI 출력 검증에 사용
# 부정문("결정하지 않습니다")은 허용, 단정·보장 표현을 잡는다.
schema_version: 1
rule_id: LANG.FORBIDDEN_CLAIMS.v1
patterns:
  - { id: guarantee, regex: "(건강|성공|재물|부자|출세|행복|합격|장수)\\S{0,3}\\s*(을|를|이|가)?\\s*보장(합니다|한다|됩니다|된다)" }
  - { id: certainty, regex: "반드시\\s*(성공|부자|출세|행복|잘\\s*된|큰\\s*인물|불행|실패)" }
  - { id: destiny, regex: "운명(을|이)\\s*(결정(한다|합니다|됩니다|된다)|바꿉니다|바꾼다|정해집니다|정해진다)" }
  - { id: health, regex: "(병|질병|사고)(을|를|이|가)?\\s*(막아|예방해)\\s*(줍니다|준다)" }
  - { id: absolute_luck, regex: "(최고의|완벽한)\\s*(길한\\s*)?이름(입니다|이다)" }
