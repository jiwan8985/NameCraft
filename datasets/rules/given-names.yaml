# 실제로 쓰이는 한국 이름 사전 (SRC-DEV-GIVEN-NAMES) — 개발자 큐레이션
# - 규칙 기반 생성은 이 목록 '안에서만' 고른다. 음절을 기계적으로 조합하지 않는다(어색한 이름 방지).
# - 목적: 지금 태어나는 아기의 이름. 2015년 이후 신생아에게 자주 지어지는 이름과 순우리말 이름만 둔다
#   (부모 세대 느낌의 이름 — 은정·선영·성훈·민호 등 — 은 넣지 않음). 개발자 지식 기반, 공식 통계 아님.
# - sex: m(남아에 흔함) f(여아에 흔함) n(둘 다) — 사용자가 고른 성별에 맞춰 반대 성별 경향 이름은 빼고 고른다.
# - style: modern(요즘 느낌) classic(단정·전통적) native(순우리말, 한글 이름)
# - 순우리말(native) 이름과, 이름에 쓰는 좋은 뜻 한자가 없는 음절(예: 엘·루)이 들어간 이름은 한글 이름으로만 제안한다.
# - trend: true = 최근(2020년대) 신생아 이름에서 특히 많이 보이는 '요즘 인기' 이름 — 화면에 표시하고, '요즘 느낌'을 고르면 우대.
